---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: installs.apps.stripe.m.clifton.quest
spec:
  group: apps.stripe.m.clifton.quest
  names:
    categories:
    - crossplane
    - managed
    - stripe
    kind: Install
    listKind: InstallList
    plural: installs
    singular: install
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An app install represents a Stripe App that is installed on an account. It reports the permissions,
          content security policy entries, and endpoints that the installing account has authorized, along with any
          that the app's latest version requests but the account has not authorized yet. Use the Install API to
          install, reauthorize, and uninstall apps, and to check the state of existing installs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  app:
                    description: The ID of the app to install.
                    type: string
                    x-kubernetes-validations:
                    - message: app is immutable
                      rule: self == oldSelf
                  channel:
                    description: The distribution channel to install from. Defaults
                      to `public`. A private app must be installed on `private_test`
                      or `private_live`, matching the mode of the API key.
                    enum:
                    - private_live
                    - private_test
                    - public
                    - testing
                    type: string
                    x-kubernetes-validations:
                    - message: channel is immutable
                      rule: self == oldSelf
                  codeChallenge:
                    description: For OAuth apps, the PKCE code challenge used to issue
                      the `auth_code` returned on the install. Must be 43 to 128 characters
                      and contain only letters, numbers, `-`, `.`, `_`, and `~`. Only
                      applies to installs made by the app developer or an embedding
                      platform; ignored when an account installs its own private app.
                    type: string
                    x-kubernetes-validations:
                    - message: codeChallenge is immutable
                      rule: self == oldSelf
                  codeChallengeMethod:
                    description: The method used to derive `code_challenge`. Required
                      when `code_challenge` is provided, and must be `S256`.
                    type: string
                    x-kubernetes-validations:
                    - message: codeChallengeMethod is immutable
                      rule: self == oldSelf
                required:
                - app
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  account:
                    description: The ID of the account that the app install belongs
                      to.
                    type: string
                  app:
                    description: The ID of the app installed.
                    type: string
                  approvalRequired:
                    description: Whether the installer must authorize pending permissions,
                      content security policy entries, or endpoints. For private apps,
                      `approval_required` stays `false`; creating or reauthorizing
                      the install through the API installs the newest completed upload
                      and grants its permissions.
                    type: boolean
                  authCode:
                    description: The authorization code for an oauth app install.
                    type: string
                  channel:
                    description: The distribution channel associated with the app
                      install.
                    type: string
                  contentSecurityPolicyGranted:
                    x-kubernetes-preserve-unknown-fields: true
                  contentSecurityPolicyPending:
                    x-kubernetes-preserve-unknown-fields: true
                  created:
                    description: Time at which the object was created. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  createdBy:
                    description: The ID of the embedding platform that created the
                      install, if applicable.
                    type: string
                  endpointsGranted:
                    description: The endpoint URLs authorized by the installer.
                    x-kubernetes-preserve-unknown-fields: true
                  endpointsPending:
                    description: The endpoint URLs requested by the latest app version
                      that the installer has not authorized.
                    x-kubernetes-preserve-unknown-fields: true
                  id:
                    description: Unique identifier for the object.
                    type: string
                  livemode:
                    description: If the object exists in live mode, the value is `true`.
                      If the object exists in test mode, the value is `false`.
                    type: boolean
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  permissionsGranted:
                    description: The permissions authorized by the installer.
                    x-kubernetes-preserve-unknown-fields: true
                  permissionsPending:
                    description: The permissions requested by the latest app version
                      that the installer has not authorized.
                    x-kubernetes-preserve-unknown-fields: true
                  status:
                    description: The status of the app install.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
