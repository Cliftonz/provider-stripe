                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  amount:
                    description: The integer amount in cents (or local equivalent)
                      representing the total amount of the credit note, including
                      tax.
                    format: int64
                    type: integer
                  amountShipping:
                    description: This is the sum of all the shipping amounts.
                    format: int64
                    type: integer
                  created:
                    description: Time at which the object was created. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                    type: string
                  customer:
                    description: ID of the customer.
                    type: string
                  customerAccount:
                    description: ID of the account representing the customer.
                    type: string
                  customerBalanceTransaction:
                    description: Customer balance transaction related to this credit
                      note.
                    type: string
                  discountAmount:
                    description: The integer amount in cents (or local equivalent)
                      representing the total amount of discount that was credited.
                    format: int64
                    type: integer
                  discountAmounts:
                    description: The aggregate amounts calculated per discount for
                      all line items.
                    x-kubernetes-preserve-unknown-fields: true
                  effectiveAt:
                    description: The date when this credit note is in effect. Same
                      as `created` unless overwritten. When defined, this value replaces
                      the system-generated 'Date of issue' printed on the credit note
                      PDF.
                    format: int64
                    type: integer
                  id:
                    description: Unique identifier for the object.
                    type: string
                  invoice:
                    description: ID of the invoice.
                    type: string
                  lines:
                    description: Line items that make up the credit note
                    x-kubernetes-preserve-unknown-fields: true
                  livemode:
                    description: If the object exists in live mode, the value is `true`.
                      If the object exists in test mode, the value is `false`.
                    type: boolean
                  memo:
                    description: Customer-facing text that appears on the credit note
                      PDF.
                    type: string
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                    type: object
                  number:
                    description: A unique number that identifies this particular credit
                      note and appears on the PDF of the credit note and its associated
                      invoice.
                    type: string
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  outOfBandAmount:
                    description: Amount that was credited outside of Stripe.
                    format: int64
                    type: integer
                  pdf:
                    description: The link to download the PDF of the credit note.
                    type: string
                  postPaymentAmount:
                    description: The amount of the credit note that was refunded to
                      the customer, credited to the customer's balance, credited outside
                      of Stripe, or any combination thereof.
                    format: int64
                    type: integer
                  prePaymentAmount:
                    description: The amount of the credit note by which the invoice's
                      `amount_remaining` and `amount_due` were reduced.
                    format: int64
                    type: integer
                  pretaxCreditAmounts:
                    description: 'The pretax credit amounts (ex: discount, credit
                      grants, etc) for all line items.'
                    x-kubernetes-preserve-unknown-fields: true
                  reason:
                    description: Reason for issuing this credit note, one of `duplicate`,
                      `fraudulent`, `order_change`, or `product_unsatisfactory`
                    type: string
                  refunds:
                    description: Refunds related to this credit note.
                    x-kubernetes-preserve-unknown-fields: true
                  shippingCost:
                    description: The details of the cost of shipping, including the
                      ShippingRate applied to the invoice.
                    x-kubernetes-preserve-unknown-fields: true
                  status:
                    description: Status of this credit note, one of `issued` or `void`.
                      Learn more about [voiding credit notes](https://docs.stripe.com/billing/invoices/credit-notes#voiding).
                    type: string
                  subtotal:
                    description: The integer amount in cents (or local equivalent)
                      representing the amount of the credit note, excluding exclusive
                      tax and invoice level discounts.
                    format: int64
                    type: integer
                  subtotalExcludingTax:
                    description: The integer amount in cents (or local equivalent)
                      representing the amount of the credit note, excluding all tax
                      and invoice level discounts.
                    format: int64
                    type: integer
                  total:
                    description: The integer amount in cents (or local equivalent)
                      representing the total amount of the credit note, including
                      tax and all discount.
                    format: int64
                    type: integer
                  totalExcludingTax:
                    description: The integer amount in cents (or local equivalent)
                      representing the total amount of the credit note, excluding
                      tax, but including discounts.
                    format: int64
                    type: integer
                  totalTaxes:
                    description: The aggregate tax information for all line items.
                    x-kubernetes-preserve-unknown-fields: true
                  type:
                    description: Type of this credit note, one of `pre_payment` or
                      `post_payment`. A `pre_payment` credit note means it was issued
                      when the invoice was open. A `post_payment` credit note means
                      it was issued when the invoice was paid.
                    type: string
                  voidedAt:
                    description: The time that the credit note was voided.
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
