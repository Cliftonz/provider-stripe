---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: creditnotes.core.stripe.m.clifton.quest
spec:
  group: core.stripe.m.clifton.quest
  names:
    categories:
    - crossplane
    - managed
    - stripe
    kind: CreditNote
    listKind: CreditNoteList
    plural: creditnotes
    singular: creditnote
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Issue a credit note to adjust an invoice's amount after the invoice is finalized.

          Related guide: [Credit notes](https://docs.stripe.com/billing/invoices/credit-notes)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  amount:
                    description: The integer amount in cents (or local equivalent)
                      representing the total amount of the credit note. One of `amount`,
                      `lines`, or `shipping_cost` must be provided.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: amount is immutable
                      rule: self == oldSelf
                  creditAmount:
                    description: The integer amount in cents (or local equivalent)
                      representing the amount to credit the customer's balance, which
                      will be automatically applied to their next invoice.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: creditAmount is immutable
                      rule: self == oldSelf
                  effectiveAt:
                    description: The date when this credit note is in effect. Same
                      as `created` unless overwritten. When defined, this value replaces
                      the system-generated 'Date of issue' printed on the credit note
                      PDF.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: effectiveAt is immutable
                      rule: self == oldSelf
                  emailType:
                    description: Type of email to send to the customer, one of `credit_note`
                      or `none` and the default is `credit_note`.
                    enum:
                    - credit_note
                    - none
                    type: string
                    x-kubernetes-validations:
                    - message: emailType is immutable
                      rule: self == oldSelf
                  invoice:
                    description: ID of the invoice.
                    type: string
                    x-kubernetes-validations:
                    - message: invoice is immutable
                      rule: self == oldSelf
                  invoiceRef:
                    description: A NamespacedReference to a named object.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  invoiceSelector:
                    description: NamespacedSelector selects a namespaced object.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  lines:
                    description: Line items that make up the credit note. One of `amount`,
                      `lines`, or `shipping_cost` must be provided.
                    items:
                      properties:
                        amount:
                          format: int64
                          type: integer
                        description:
                          type: string
                        invoiceLineItem:
                          type: string
                        metadata:
                          additionalProperties:
                            type: string
                          type: object
                        quantity:
                          format: int64
                          type: integer
                        taxAmounts:
                          items:
                            properties:
                              amount:
                                format: int64
                                type: integer
                              taxRate:
                                type: string
                              taxableAmount:
                                format: int64
                                type: integer
                            required:
                            - amount
                            - taxRate
                            - taxableAmount
                            type: object
                          type: array
                        taxRates:
                          items:
                            type: string
                          type: array
                        type:
                          enum:
                          - custom_line_item
                          - invoice_line_item
                          type: string
                        unitAmount:
                          format: int64
                          type: integer
                        unitAmountDecimal:
                          type: string
                      required:
                      - type
                      type: object
                    type: array
                    x-kubernetes-validations:
                    - message: lines is immutable
                      rule: self == oldSelf
                  memo:
                    description: The credit note's memo appears on the credit note
                      PDF.
                    type: string
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                      Individual keys can be unset by posting an empty value to them.
                      All keys can be unset by posting an empty value to `metadata`.
                    type: object
                  outOfBandAmount:
                    description: The integer amount in cents (or local equivalent)
                      representing the amount that is credited outside of Stripe.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: outOfBandAmount is immutable
                      rule: self == oldSelf
                  reason:
                    description: Reason for issuing this credit note, one of `duplicate`,
                      `fraudulent`, `order_change`, or `product_unsatisfactory`
                    enum:
                    - duplicate
                    - fraudulent
                    - order_change
                    - product_unsatisfactory
                    type: string
                    x-kubernetes-validations:
                    - message: reason is immutable
                      rule: self == oldSelf
                  refundAmount:
                    description: The integer amount in cents (or local equivalent)
                      representing the amount to refund. If set, a refund will be
                      created for the charge associated with the invoice.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: refundAmount is immutable
                      rule: self == oldSelf
                  refunds:
                    description: Refunds to link to this credit note.
                    items:
                      properties:
                        amountRefunded:
                          format: int64
                          type: integer
                        paymentRecordRefund:
                          properties:
                            paymentRecord:
                              type: string
                            refundGroup:
                              type: string
                          required:
                          - paymentRecord
                          - refundGroup
                          type: object
                        refund:
                          type: string
                        type:
                          enum:
                          - payment_record_refund
                          - refund
                          type: string
                      type: object
                    type: array
                    x-kubernetes-validations:
                    - message: refunds is immutable
                      rule: self == oldSelf
                  shippingCost:
                    description: When shipping_cost contains the shipping_rate from
                      the invoice, the shipping_cost is included in the credit note.
                      One of `amount`, `lines`, or `shipping_cost` must be provided.
                    properties:
                      shippingRate:
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: shippingCost is immutable
                      rule: self == oldSelf
                type: object
                x-kubernetes-validations:
                - message: invoice, invoiceRef or invoiceSelector is required
                  rule: has(self.invoice) || has(self.invoiceRef) || has(self.invoiceSelector)
              managementPolicies:
                default:
                - '*'
