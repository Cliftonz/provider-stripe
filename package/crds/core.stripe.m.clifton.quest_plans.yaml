---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: plans.core.stripe.m.clifton.quest
spec:
  group: core.stripe.m.clifton.quest
  names:
    categories:
    - crossplane
    - managed
    - stripe
    kind: Plan
    listKind: PlanList
    plural: plans
    singular: plan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          You can now model subscriptions more flexibly using the [Prices API](https://docs.stripe.com/api#prices). It replaces the Plans API and is backwards compatible to simplify your migration.

          Plans define the base price, currency, and billing cycle for recurring purchases of products.
          [Products](https://docs.stripe.com/api#products) help you track inventory or provisioning, and plans help you track pricing. Different physical goods or levels of service should be represented by products, and pricing options should be represented by plans. This approach lets you change prices without having to change your provisioning scheme.

          For example, you might have a single "gold" product that has plans for $10/month, $100/year, €9/month, and €90/year.

          Related guides: [Set up a subscription](https://docs.stripe.com/billing/subscriptions/set-up-subscription) and more about [products and prices](https://docs.stripe.com/products-prices/overview).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  active:
                    description: Whether the plan is currently available for new subscriptions.
                      Defaults to `true`.
                    type: boolean
                  amount:
                    description: A positive integer in cents (or local equivalent)
                      (or 0 for a free plan) representing how much to charge on a
                      recurring basis.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: amount is immutable
                      rule: self == oldSelf
                  amountDecimal:
                    description: Same as `amount`, but accepts a decimal value with
                      at most 12 decimal places. Only one of `amount` and `amount_decimal`
                      can be set.
                    type: string
                    x-kubernetes-validations:
                    - message: amountDecimal is immutable
                      rule: self == oldSelf
                  billingScheme:
                    description: Describes how to compute the price per period. Either
                      `per_unit` or `tiered`. `per_unit` indicates that the fixed
                      amount (specified in `amount`) will be charged per unit in `quantity`
                      (for plans with `usage_type=licensed`), or per unit of total
                      usage (for plans with `usage_type=metered`). `tiered` indicates
                      that the unit pricing will be computed using a tiering strategy
                      as defined using the `tiers` and `tiers_mode` attributes.
                    enum:
                    - per_unit
                    - tiered
                    type: string
                    x-kubernetes-validations:
                    - message: billingScheme is immutable
                      rule: self == oldSelf
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                    type: string
                    x-kubernetes-validations:
                    - message: currency is immutable
                      rule: self == oldSelf
                  id:
                    description: An identifier randomly generated by Stripe. Used
                      to identify this plan when subscribing a customer. You can optionally
                      override this ID, but the ID must be unique across all plans
                      in your Stripe account. You can use the same plan ID in live
                      mode and in your sandboxes.
                    type: string
                    x-kubernetes-validations:
                    - message: id is immutable
                      rule: self == oldSelf
                  interval:
                    description: Specifies billing frequency. Either `day`, `week`,
                      `month` or `year`.
                    enum:
                    - day
                    - month
                    - week
                    - year
                    type: string
                    x-kubernetes-validations:
                    - message: interval is immutable
                      rule: self == oldSelf
                  intervalCount:
                    description: The number of intervals between subscription billings.
                      For example, `interval=month` and `interval_count=3` bills every
                      3 months. Maximum of three years interval allowed (3 years,
                      36 months, or 156 weeks).
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: intervalCount is immutable
                      rule: self == oldSelf
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                      Individual keys can be unset by posting an empty value to them.
                      All keys can be unset by posting an empty value to `metadata`.
                    type: object
                  meter:
                    description: The meter tracking the usage of a metered price
                    type: string
                    x-kubernetes-validations:
                    - message: meter is immutable
                      rule: self == oldSelf
                  nickname:
                    description: A brief description of the plan, hidden from customers.
                    type: string
                  product:
                    x-kubernetes-preserve-unknown-fields: true
                  tiers:
                    description: Each element represents a pricing tier. This parameter
                      requires `billing_scheme` to be set to `tiered`. See also the
                      documentation for `billing_scheme`.
                    items:
                      properties:
                        flatAmount:
                          format: int64
                          type: integer
                        flatAmountDecimal:
                          type: string
                        unitAmount:
                          format: int64
                          type: integer
                        unitAmountDecimal:
                          type: string
                        upTo:
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - upTo
                      type: object
                    type: array
                    x-kubernetes-validations:
                    - message: tiers is immutable
                      rule: self == oldSelf
                  tiersMode:
                    description: Defines if the tiering price should be `graduated`
                      or `volume` based. In `volume`-based tiering, the maximum quantity
                      within a period determines the per unit price, in `graduated`
                      tiering pricing can successively change as the quantity grows.
                    enum:
                    - graduated
                    - volume
                    type: string
                    x-kubernetes-validations:
                    - message: tiersMode is immutable
                      rule: self == oldSelf
                  transformUsage:
                    description: Apply a transformation to the reported usage or set
                      quantity before computing the billed price. Cannot be combined
                      with `tiers`.
                    properties:
                      divideBy:
                        format: int64
                        type: integer
                      round:
                        enum:
                        - down
                        - up
                        type: string
                    required:
                    - divideBy
                    - round
                    type: object
                    x-kubernetes-validations:
                    - message: transformUsage is immutable
                      rule: self == oldSelf
                  trialPeriodDays:
                    description: Default number of trial days when subscribing a customer
                      to this plan using [`trial_from_plan=true`](https://docs.stripe.com/api#create_subscription-trial_from_plan).
                    format: int64
                    type: integer
                  usageType:
                    description: Configures how the quantity per period should be
                      determined. Can be either `metered` or `licensed`. `licensed`
                      automatically bills the `quantity` set when adding it to a subscription.
                      `metered` aggregates the total usage based on usage records.
                      Defaults to `licensed`.
                    enum:
                    - licensed
                    - metered
                    type: string
                    x-kubernetes-validations:
                    - message: usageType is immutable
                      rule: self == oldSelf
                required:
                - currency
                - interval
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  active:
                    description: Whether the plan can be used for new purchases.
                    type: boolean
                  amount:
                    description: The unit amount in cents (or local equivalent) to
                      be charged, represented as a whole integer if possible. Only
                      set if `billing_scheme=per_unit`.
                    format: int64
                    type: integer
                  amountDecimal:
                    description: The unit amount in cents (or local equivalent) to
                      be charged, represented as a decimal string with at most 12
                      decimal places. Only set if `billing_scheme=per_unit`.
                    type: string
                  billingScheme:
                    description: Describes how to compute the price per period. Either
                      `per_unit` or `tiered`. `per_unit` indicates that the fixed
                      amount (specified in `amount`) will be charged per unit in `quantity`
                      (for plans with `usage_type=licensed`), or per unit of total
                      usage (for plans with `usage_type=metered`). `tiered` indicates
                      that the unit pricing will be computed using a tiering strategy
                      as defined using the `tiers` and `tiers_mode` attributes.
                    type: string
                  created:
                    description: Time at which the object was created. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                    type: string
                  id:
                    description: Unique identifier for the object.
                    type: string
                  interval:
                    description: The frequency at which a subscription is billed.
                      One of `day`, `week`, `month` or `year`.
                    type: string
                  intervalCount:
                    description: The number of intervals (specified in the `interval`
                      attribute) between subscription billings. For example, `interval=month`
                      and `interval_count=3` bills every 3 months.
                    format: int64
                    type: integer
                  livemode:
                    description: If the object exists in live mode, the value is `true`.
                      If the object exists in test mode, the value is `false`.
                    type: boolean
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                    type: object
                  meter:
                    description: The meter tracking the usage of a metered price
                    type: string
                  nickname:
                    description: A brief description of the plan, hidden from customers.
                    type: string
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  product:
                    description: The product whose pricing this plan determines.
                    type: string
                  tiers:
                    description: Each element represents a pricing tier. This parameter
                      requires `billing_scheme` to be set to `tiered`. See also the
                      documentation for `billing_scheme`.
                    x-kubernetes-preserve-unknown-fields: true
                  tiersMode:
                    description: Defines if the tiering price should be `graduated`
                      or `volume` based. In `volume`-based tiering, the maximum quantity
                      within a period determines the per unit price. In `graduated`
                      tiering, pricing can change as the quantity grows.
                    type: string
                  transformUsage:
                    description: Apply a transformation to the reported usage or set
                      quantity before computing the amount billed. Cannot be combined
                      with `tiers`.
                    x-kubernetes-preserve-unknown-fields: true
                  trialPeriodDays:
                    description: Default number of trial days when subscribing a customer
                      to this plan using [`trial_from_plan=true`](https://docs.stripe.com/api#create_subscription-trial_from_plan).
                    format: int64
                    type: integer
                  usageType:
                    description: Configures how the quantity per period should be
                      determined. Can be either `metered` or `licensed`. `licensed`
                      automatically bills the `quantity` set when adding it to a subscription.
                      `metered` aggregates the total usage based on usage records.
                      Defaults to `licensed`.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
