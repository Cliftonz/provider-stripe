                  status:
                    description: Whether authorizations can be approved on this card.
                      May be blocked from activating cards depending on past-due Cardholder
                      requirements. Defaults to `inactive`.
                    enum:
                    - active
                    - inactive
                    type: string
                  type:
                    description: The type of card to issue. Possible values are `physical`
                      or `virtual`.
                    enum:
                    - physical
                    - virtual
                    type: string
                    x-kubernetes-validations:
                    - message: type is immutable
                      rule: self == oldSelf
