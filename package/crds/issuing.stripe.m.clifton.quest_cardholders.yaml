                        - country
                        - line1
                        - postalCode
                        type: object
                    required:
                    - address
                    type: object
                  company:
                    description: Additional information about a `company` cardholder.
                    properties:
                      taxId:
                        type: string
                    type: object
                  email:
                    description: The cardholder's email address.
                    type: string
                  individual:
                    description: Additional information about an `individual` cardholder.
                    properties:
                      cardIssuing:
                        properties:
                          userTermsAcceptance:
                            properties:
                              date:
                                format: int64
                                type: integer
                              ip:
                                type: string
                              userAgent:
                                type: string
                            type: object
                        type: object
                      dob:
                        properties:
                          day:
                            format: int64
                            type: integer
                          month:
                            format: int64
                            type: integer
                          year:
                            format: int64
                            type: integer
                        required:
