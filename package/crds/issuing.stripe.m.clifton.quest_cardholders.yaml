                      additional information about the object in a structured format.
                      Individual keys can be unset by posting an empty value to them.
                      All keys can be unset by posting an empty value to `metadata`.
                    type: object
                  name:
                    description: The cardholder's name. This will be printed on cards
                      issued to them. The maximum length of this field is 24 characters.
                      This field cannot contain any special characters or numbers.
                    type: string
                    x-kubernetes-validations:
                    - message: name is immutable
                      rule: self == oldSelf
                  phoneNumber:
                    description: The cardholder's phone number. This will be transformed
                      to [E.164](https://en.wikipedia.org/wiki/E.164) if it is not
                      provided in that format already. This is required for all cardholders
                      who will be creating EU cards. See the [3D Secure documentation](https://docs.stripe.com/issuing/3d-secure#when-is-3d-secure-applied)
                      for more details.
                    type: string
