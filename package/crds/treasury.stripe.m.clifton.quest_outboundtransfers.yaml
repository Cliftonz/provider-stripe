                            - us_domestic_wire
                            type: string
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: destinationPaymentMethodOptions is immutable
                      rule: self == oldSelf
                  financialAccount:
                    description: The FinancialAccount to pull funds from.
                    type: string
                    x-kubernetes-validations:
                    - message: financialAccount is immutable
                      rule: self == oldSelf
