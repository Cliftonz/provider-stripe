                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: amount is immutable
                      rule: self == oldSelf
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                    type: string
                    x-kubernetes-validations:
                    - message: currency is immutable
                      rule: self == oldSelf
                  description:
                    description: An arbitrary string attached to the object. Often
                      useful for displaying to users.
                    type: string
                    x-kubernetes-validations:
                    - message: description is immutable
                      rule: self == oldSelf
                  destinationPaymentMethod:
                    description: The PaymentMethod to use as the payment instrument
                      for the OutboundTransfer.
                    type: string
                    x-kubernetes-validations:
                    - message: destinationPaymentMethod is immutable
                      rule: self == oldSelf
                  destinationPaymentMethodData:
                    description: Hash used to generate the PaymentMethod to be used
                      for this OutboundTransfer. Exclusive with `destination_payment_method`.
                    properties:
                      financialAccount:
