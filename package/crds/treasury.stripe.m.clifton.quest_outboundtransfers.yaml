                      type:
                        enum:
                        - financial_account
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: destinationPaymentMethodData is immutable
                      rule: self == oldSelf
                  destinationPaymentMethodOptions:
                    description: Hash describing payment method configuration details.
                    properties:
