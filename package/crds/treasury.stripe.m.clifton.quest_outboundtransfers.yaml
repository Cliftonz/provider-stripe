                    type: string
                  description:
                    description: An arbitrary string attached to the object. Often
                      useful for displaying to users.
                    type: string
                  destinationPaymentMethod:
                    description: The PaymentMethod used as the payment instrument
                      for an OutboundTransfer.
                    type: string
                  destinationPaymentMethodDetails:
                    x-kubernetes-preserve-unknown-fields: true
                  expectedArrivalDate:
                    description: The date when funds are expected to arrive in the
                      destination account.
                    format: int64
                    type: integer
                  financialAccount:
                    description: The FinancialAccount that funds were pulled from.
                    type: string
                  hostedRegulatoryReceiptUrl:
                    description: A [hosted transaction receipt](https://docs.stripe.com/treasury/moving-money/regulatory-receipts)
                      URL that is provided when money movement is considered regulated
                      under Stripe's money transmission licenses.
                    type: string
                  id:
                    description: Unique identifier for the object.
                    type: string
                  livemode:
                    description: If the object exists in live mode, the value is `true`.
                      If the object exists in test mode, the value is `false`.
