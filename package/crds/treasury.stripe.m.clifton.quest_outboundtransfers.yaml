                    x-kubernetes-preserve-unknown-fields: true
                  statementDescriptor:
                    description: Information about the OutboundTransfer to be sent
                      to the recipient account.
                    type: string
                  status:
                    description: 'Current status of the OutboundTransfer: `processing`,
                      `failed`, `canceled`, `posted`, `returned`. An OutboundTransfer
                      is `processing` if it has been created and is pending. The status
                      changes to `posted` once the OutboundTransfer has been "confirmed"
                      and funds have left the account, or to `failed` or `canceled`.
                      If an OutboundTransfer fails to arrive at its destination, its
                      status will change to `returned`.'
                    type: string
                  statusTransitions:
                    x-kubernetes-preserve-unknown-fields: true
                  trackingDetails:
                    description: Details about network-specific tracking information
                      if available.
                    x-kubernetes-preserve-unknown-fields: true
                  transaction:
                    description: The Transaction associated with this object.
                    type: string
