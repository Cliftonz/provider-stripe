---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: orders.climate.stripe.m.clifton.quest
spec:
  group: climate.stripe.m.clifton.quest
  names:
    categories:
    - crossplane
    - managed
    - stripe
    kind: Order
    listKind: OrderList
    plural: orders
    singular: order
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Orders represent your intent to purchase a particular Climate product. When you create an order, the
          payment is deducted from your merchant balance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  amount:
                    description: Requested amount of carbon removal units. Either
                      this or `metric_tons` must be specified.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: amount is immutable
                      rule: self == oldSelf
                  beneficiary:
                    description: Publicly sharable reference for the end beneficiary
                      of carbon removal. Assumed to be the Stripe account if not set.
                    properties:
                      publicName:
                        type: string
                    required:
                    - publicName
                    type: object
                  currency:
                    description: Request currency for the order as a three-letter
                      [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a supported [settlement currency for your
                      account](https://stripe.com/docs/currencies). If omitted, the
                      account's default currency will be used.
                    type: string
                    x-kubernetes-validations:
                    - message: currency is immutable
                      rule: self == oldSelf
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                      Individual keys can be unset by posting an empty value to them.
                      All keys can be unset by posting an empty value to `metadata`.
                    type: object
                  metricTons:
                    description: Requested number of tons for the order. Either this
                      or `amount` must be specified.
                    type: string
                    x-kubernetes-validations:
                    - message: metricTons is immutable
                      rule: self == oldSelf
                  product:
                    description: Unique identifier of the Climate product.
                    type: string
                    x-kubernetes-validations:
                    - message: product is immutable
                      rule: self == oldSelf
                required:
                - product
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  amountFees:
                    description: Total amount of [Frontier](https://frontierclimate.com/)'s
                      service fees in the currency's smallest unit.
                    format: int64
                    type: integer
                  amountSubtotal:
                    description: Total amount of the carbon removal in the currency's
                      smallest unit.
                    format: int64
                    type: integer
                  amountTotal:
                    description: Total amount of the order including fees in the currency's
                      smallest unit.
                    format: int64
                    type: integer
                  beneficiary:
                    x-kubernetes-preserve-unknown-fields: true
                  canceledAt:
                    description: Time at which the order was canceled. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  cancellationReason:
                    description: Reason for the cancellation of this order.
                    type: string
                  certificate:
                    description: For delivered orders, a URL to a delivery certificate
                      for the order.
                    type: string
                  confirmedAt:
                    description: Time at which the order was confirmed. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  created:
                    description: Time at which the object was created. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase, representing the currency for this order.
                    type: string
                  delayedAt:
                    description: Time at which the order's expected_delivery_year
                      was delayed. Measured in seconds since the Unix epoch.
                    format: int64
                    type: integer
                  deliveredAt:
                    description: Time at which the order was delivered. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  deliveryDetails:
                    description: Details about the delivery of carbon removal for
                      this order.
                    x-kubernetes-preserve-unknown-fields: true
                  expectedDeliveryYear:
                    description: The year this order is expected to be delivered.
                      If the year is in the past, the order is a spot purchase and
                      will be delivered within 30 days of purchase.
                    format: int64
                    type: integer
                  id:
                    description: Unique identifier for the object.
                    type: string
                  livemode:
                    description: Has the value `true` if the object exists in live
                      mode or the value `false` if the object exists in test mode.
                    type: boolean
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                    type: object
                  metricTons:
                    description: Quantity of carbon removal that is included in this
                      order.
                    type: string
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  product:
                    description: Unique ID for the Climate `Product` this order is
                      purchasing.
                    type: string
                  productSubstitutedAt:
                    description: Time at which the order's product was substituted
                      for a different product. Measured in seconds since the Unix
                      epoch.
                    format: int64
                    type: integer
                  status:
                    description: The current status of this order.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
