---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: coupons.core.stripe.m.clifton.quest
spec:
  group: core.stripe.m.clifton.quest
  names:
    categories:
    - crossplane
    - managed
    - stripe
    kind: Coupon
    listKind: CouponList
    plural: coupons
    singular: coupon
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A coupon contains information about a percent-off or amount-off discount you
          might want to apply to a customer. Coupons may be applied to [subscriptions](https://docs.stripe.com/api#subscriptions), [invoices](https://docs.stripe.com/api#invoices),
          [checkout sessions](https://docs.stripe.com/api/checkout/sessions), [quotes](https://docs.stripe.com/api#quotes), and more. Coupons do not work with conventional one-off [charges](/api/charges/create) or [payment intents](https://docs.stripe.com/api/payment_intents).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  amountOff:
                    description: A positive integer representing the amount to subtract
                      from an invoice total (required if `percent_off` is not passed).
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: amountOff is immutable
                      rule: self == oldSelf
                  appliesTo:
                    description: A hash containing directions for what this Coupon
                      will apply discounts to.
                    properties:
                      products:
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: appliesTo is immutable
                      rule: self == oldSelf
                  currency:
                    description: Three-letter [ISO code for the currency](https://stripe.com/docs/currencies)
                      of the `amount_off` parameter (required if `amount_off` is passed).
                    type: string
                    x-kubernetes-validations:
                    - message: currency is immutable
                      rule: self == oldSelf
                  currencyOptions:
                    additionalProperties:
                      properties:
                        amountOff:
                          format: int64
                          type: integer
                      required:
                      - amountOff
                      type: object
                    description: Coupons defined in each available currency option
                      (only supported if `amount_off` is passed). Each key must be
                      a three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html)
                      and a [supported currency](https://stripe.com/docs/currencies).
                    type: object
                  duration:
                    description: Specifies how long the discount will be in effect
                      if used on a subscription. Defaults to `once`.
                    enum:
                    - forever
                    - once
                    - repeating
                    type: string
                    x-kubernetes-validations:
                    - message: duration is immutable
                      rule: self == oldSelf
                  durationInMonths:
                    description: Required only if `duration` is `repeating`, in which
                      case it must be a positive integer that specifies the number
                      of months the discount will be in effect.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: durationInMonths is immutable
                      rule: self == oldSelf
                  id:
                    description: Unique string of your choice that will be used to
                      identify this coupon when applying it to a customer. If you
                      don't want to specify a particular code, you can leave the ID
                      blank and we'll generate a random code for you.
                    type: string
                    x-kubernetes-validations:
                    - message: id is immutable
                      rule: self == oldSelf
                  maxRedemptions:
                    description: A positive integer specifying the number of times
                      the coupon can be redeemed before it's no longer valid. For
                      example, you might have a 50% off coupon that the first 20 readers
                      of your blog can use.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: maxRedemptions is immutable
                      rule: self == oldSelf
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                      Individual keys can be unset by posting an empty value to them.
                      All keys can be unset by posting an empty value to `metadata`.
                    type: object
                  name:
                    description: Name of the coupon displayed to customers on, for
                      instance invoices, or receipts. By default the `id` is shown
                      if `name` is not set.
                    type: string
                  percentOff:
                    description: A positive float larger than 0, and smaller or equal
                      to 100, that represents the discount the coupon will apply (required
                      if `amount_off` is not passed).
                    type: number
                    x-kubernetes-validations:
                    - message: percentOff is immutable
                      rule: self == oldSelf
                  redeemBy:
                    description: Unix timestamp specifying the last time at which
                      the coupon can be redeemed (cannot be set to more than 5 years
                      in the future). After the redeem_by date, the coupon can no
                      longer be applied to new customers.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: redeemBy is immutable
                      rule: self == oldSelf
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  amountOff:
                    description: Amount (in the `currency` specified) that will be
                      taken off the subtotal of any invoices for this customer.
                    format: int64
                    type: integer
                  appliesTo:
                    x-kubernetes-preserve-unknown-fields: true
                  created:
                    description: Time at which the object was created. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  currency:
                    description: If `amount_off` has been set, the three-letter [ISO
                      code for the currency](https://stripe.com/docs/currencies) of
                      the amount to take off.
                    type: string
                  currencyOptions:
                    description: Coupons defined in each available currency option.
                      Each key must be a three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html)
                      and a [supported currency](https://stripe.com/docs/currencies).
                    x-kubernetes-preserve-unknown-fields: true
                  duration:
                    description: One of `forever`, `once`, or `repeating`. Describes
                      how long a customer who applies this coupon will get the discount.
                    type: string
                  durationInMonths:
                    description: If `duration` is `repeating`, the number of months
                      the coupon applies. Null if coupon `duration` is `forever` or
                      `once`.
                    format: int64
                    type: integer
                  id:
                    description: Unique identifier for the object.
                    type: string
                  livemode:
                    description: If the object exists in live mode, the value is `true`.
                      If the object exists in test mode, the value is `false`.
                    type: boolean
                  maxRedemptions:
                    description: Maximum number of times this coupon can be redeemed,
                      in total, across all customers, before it is no longer valid.
                    format: int64
                    type: integer
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                    type: object
                  name:
                    description: Name of the coupon displayed to customers on for
                      instance invoices or receipts.
                    type: string
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  percentOff:
                    description: Percent that will be taken off the subtotal of any
                      invoices for this customer for the duration of the coupon. For
                      example, a coupon with percent_off of 50 will make a $ (or local
                      equivalent)100 invoice $ (or local equivalent)50 instead.
                    type: number
                  redeemBy:
                    description: Date after which the coupon can no longer be redeemed.
                    format: int64
                    type: integer
                  timesRedeemed:
                    description: Number of times this coupon has been applied to a
                      customer.
                    format: int64
                    type: integer
                  valid:
                    description: Taking account of the above properties, whether this
                      coupon can still be applied to a customer.
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
