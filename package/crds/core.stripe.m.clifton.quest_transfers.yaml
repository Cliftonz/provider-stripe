---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: transfers.core.stripe.m.clifton.quest
spec:
  group: core.stripe.m.clifton.quest
  names:
    categories:
    - crossplane
    - managed
    - stripe
    kind: Transfer
    listKind: TransferList
    plural: transfers
    singular: transfer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Transfer` object is created when you move funds between Stripe accounts as
          part of Connect.

          Before April 6, 2017, transfers also represented movement of funds from a
          Stripe account to a card or bank account. This behavior has since been split
          out into a [Payout](https://docs.stripe.com/api#payout_object) object, with corresponding payout endpoints. For more
          information, read about the
          [transfer/payout split](https://docs.stripe.com/transfer-payout-split).

          Related guide: [Creating separate charges and transfers](https://docs.stripe.com/connect/separate-charges-and-transfers)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  amount:
                    description: A positive integer in cents (or local equivalent)
                      representing how much to transfer.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: amount is immutable
                      rule: self == oldSelf
                  currency:
                    description: Three-letter [ISO code for currency](https://www.iso.org/iso-4217-currency-codes.html)
                      in lowercase. Must be a [supported currency](https://docs.stripe.com/currencies).
                    type: string
                    x-kubernetes-validations:
                    - message: currency is immutable
                      rule: self == oldSelf
                  description:
                    description: An arbitrary string attached to the object. Often
                      useful for displaying to users.
                    type: string
                  destination:
                    description: The ID of a connected Stripe account. <a href="/docs/connect/separate-charges-and-transfers">See
                      the Connect documentation</a> for details.
                    type: string
                    x-kubernetes-validations:
                    - message: destination is immutable
                      rule: self == oldSelf
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                      Individual keys can be unset by posting an empty value to them.
                      All keys can be unset by posting an empty value to `metadata`.
                    type: object
                  sourceTransaction:
                    description: You can use this parameter to transfer funds from
                      a charge before they are added to your available balance. A
                      pending balance will transfer immediately but the funds will
                      not become available until the original charge becomes available.
                      [See the Connect documentation](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-availability)
                      for details.
                    type: string
                    x-kubernetes-validations:
                    - message: sourceTransaction is immutable
                      rule: self == oldSelf
                  sourceType:
                    description: The source balance to use for this transfer. One
                      of `bank_account`, `card`, or `fpx`. For most users, this will
                      default to `card`.
                    enum:
                    - bank_account
                    - card
                    - fpx
                    type: string
                    x-kubernetes-validations:
                    - message: sourceType is immutable
                      rule: self == oldSelf
                  transferGroup:
                    description: A string that identifies this transaction as part
                      of a group. See the [Connect documentation](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-options)
                      for details.
                    type: string
                    x-kubernetes-validations:
                    - message: transferGroup is immutable
                      rule: self == oldSelf
                required:
                - currency
                - destination
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  amount:
                    description: Amount in cents (or local equivalent) to be transferred.
                    format: int64
                    type: integer
                  amountReversed:
                    description: Amount in cents (or local equivalent) reversed (can
                      be less than the amount attribute on the transfer if a partial
                      reversal was issued).
                    format: int64
                    type: integer
                  balanceTransaction:
                    description: Balance transaction that describes the impact of
                      this transfer on your account balance.
                    type: string
                  created:
                    description: Time that this record of the transfer was first created.
                    format: int64
                    type: integer
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                    type: string
                  description:
                    description: An arbitrary string attached to the object. Often
                      useful for displaying to users.
                    type: string
                  destination:
                    description: ID of the Stripe account the transfer was sent to.
                    type: string
                  destinationPayment:
                    description: If the destination is a Stripe account, this will
                      be the ID of the payment that the destination account received
                      for the transfer.
                    type: string
                  id:
                    description: Unique identifier for the object.
                    type: string
                  livemode:
                    description: If the object exists in live mode, the value is `true`.
                      If the object exists in test mode, the value is `false`.
                    type: boolean
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                    type: object
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  reversals:
                    description: A list of reversals that have been applied to the
                      transfer.
                    x-kubernetes-preserve-unknown-fields: true
                  reversed:
                    description: Whether the transfer has been fully reversed. If
                      the transfer is only partially reversed, this attribute will
                      still be false.
                    type: boolean
                  sourceTransaction:
                    description: ID of the charge that was used to fund the transfer.
                      If null, the transfer was funded from the available balance.
                    type: string
                  sourceType:
                    description: The source balance this transfer came from. One of
                      `card`, `fpx`, or `bank_account`.
                    type: string
                  transferGroup:
                    description: A string that identifies this transaction as part
                      of a group. See the [Connect documentation](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-options)
                      for details.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
