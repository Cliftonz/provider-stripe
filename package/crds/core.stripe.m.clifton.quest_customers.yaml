                    type: object
                  name:
                    description: The customer's full name or business name.
                    type: string
                  nextInvoiceSequence:
                    description: The suffix of the customer's next invoice number
                      (for example, 0001). When the account uses account level sequencing,
                      this parameter is ignored in API requests and the field omitted
                      in API responses.
                    format: int64
                    type: integer
                  object:
