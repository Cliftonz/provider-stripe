          status:
            properties:
              atProvider:
                properties:
                  address:
                    description: The customer's billing address.
                    x-kubernetes-preserve-unknown-fields: true
                  balance:
                    description: The current balance, if any, that's stored on the
                      customer in their default currency. If negative, the customer
                      has credit to apply to their next invoice. If positive, the
                      customer has an amount owed that's added to their next invoice.
                      The balance only considers amounts that Stripe hasn't successfully
                      applied to any invoice. It doesn't reflect unpaid invoices.
                      This balance is only taken into account after invoices finalize.
                      For multi-currency balances, see [invoice_credit_balance](https://docs.stripe.com/api/customers/object#customer_object-invoice_credit_balance).
                    format: int64
                    type: integer
                  businessName:
                    description: The customer's business name.
                    type: string
                  cashBalance:
                    description: The current funds being held by Stripe on behalf
                      of the customer. You can apply these funds towards payment intents
                      when the source is "cash_balance". The `settings[reconciliation_mode]`
                      field describes if these funds apply to these payment intents
                      manually or automatically.
                    x-kubernetes-preserve-unknown-fields: true
                  created:
                    description: Time at which the object was created. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  currency:
                    description: Three-letter [ISO code for the currency](https://stripe.com/docs/currencies)
                      the customer can be charged in for recurring billing purposes.
                    type: string
                  customerAccount:
                    description: The ID of an Account representing a customer. You
                      can use this ID with any v1 API that accepts a customer_account
                      parameter.
                    type: string
                  defaultSource:
                    description: |-
                      ID of the default payment source for the customer.

                      If you use payment methods created through the PaymentMethods API, see the [invoice_settings.default_payment_method](https://docs.stripe.com/api/customers/object#customer_object-invoice_settings-default_payment_method) field instead.
                    type: string
                  delinquent:
                    description: |-
                      Tracks the most recent state change on any invoice belonging to the customer. Paying an invoice or marking it uncollectible via the API will set this field to false. An automatic payment failure or passing the `invoice.due_date` will set this field to `true`.

                      If an invoice becomes uncollectible by [dunning](https://docs.stripe.com/billing/automatic-collection), `delinquent` doesn't reset to `false`.

                      If you care whether the customer has paid their most recent subscription invoice, use `subscription.status` instead. Paying or marking uncollectible any customer invoice regardless of whether it is the latest invoice for a subscription will always set this field to `false`.
                    type: boolean
                  description:
                    description: An arbitrary string attached to the object. Often
                      useful for displaying to users.
                    type: string
                  discount:
                    description: Describes the current discount active on the customer,
                      if there is one.
                    x-kubernetes-preserve-unknown-fields: true
                  email:
                    description: The customer's email address.
                    type: string
                  id:
                    description: Unique identifier for the object.
                    type: string
                  individualName:
                    description: The customer's individual name.
                    type: string
                  invoiceCreditBalance:
                    description: The current multi-currency balances, if any, that's
                      stored on the customer. If positive in a currency, the customer
                      has a credit to apply to their next invoice denominated in that
                      currency. If negative, the customer has an amount owed that's
                      added to their next invoice denominated in that currency. These
                      balances don't apply to unpaid invoices. They solely track amounts
                      that Stripe hasn't successfully applied to any invoice. Stripe
                      only applies a balance in a specific currency to an invoice
                      after that invoice (which is in the same currency) finalizes.
                    x-kubernetes-preserve-unknown-fields: true
                  invoicePrefix:
