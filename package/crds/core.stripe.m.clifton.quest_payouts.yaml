---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: payouts.core.stripe.m.clifton.quest
spec:
  group: core.stripe.m.clifton.quest
  names:
    categories:
    - crossplane
    - managed
    - stripe
    kind: Payout
    listKind: PayoutList
    plural: payouts
    singular: payout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A `Payout` object is created when you receive funds from Stripe, or when you
          initiate a payout to either a bank account or debit card of a [connected
          Stripe account](/docs/connect/bank-debit-card-payouts). You can retrieve individual payouts,
          and list all payouts. Payouts are made on [varying
          schedules](/docs/connect/manage-payout-schedule), depending on your country and
          industry.

          Related guide: [Receiving payouts](https://docs.stripe.com/payouts)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  amount:
                    description: A positive integer in cents representing how much
                      to pay out.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: amount is immutable
                      rule: self == oldSelf
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                    type: string
                    x-kubernetes-validations:
                    - message: currency is immutable
                      rule: self == oldSelf
                  description:
                    description: An arbitrary string attached to the object. Often
                      useful for displaying to users.
                    type: string
                    x-kubernetes-validations:
                    - message: description is immutable
                      rule: self == oldSelf
                  destination:
                    description: The ID of a bank account or a card to send the payout
                      to. If you don't provide a destination, we use the default external
                      account for the specified currency.
                    type: string
                    x-kubernetes-validations:
                    - message: destination is immutable
                      rule: self == oldSelf
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                      Individual keys can be unset by posting an empty value to them.
                      All keys can be unset by posting an empty value to `metadata`.
                    type: object
                  method:
                    description: The method used to send this payout, which is `standard`
                      or `instant`. We support `instant` for payouts to debit cards
                      and bank accounts in certain countries. Learn more about [bank
                      support for Instant Payouts](https://stripe.com/docs/payouts/instant-payouts-banks).
                    enum:
                    - instant
                    - standard
                    type: string
                    x-kubernetes-validations:
                    - message: method is immutable
                      rule: self == oldSelf
                  payoutMethod:
                    description: The ID of a v2 FinancialAccount to send funds to.
                    type: string
                    x-kubernetes-validations:
                    - message: payoutMethod is immutable
                      rule: self == oldSelf
                  sourceType:
                    description: The balance type of your Stripe balance to draw this
                      payout from. Balances for different payment sources are kept
                      separately. You can find the amounts with the Balances API.
                      One of `bank_account`, `card`, or `fpx`.
                    enum:
                    - bank_account
                    - card
                    - fpx
                    type: string
                    x-kubernetes-validations:
                    - message: sourceType is immutable
                      rule: self == oldSelf
                  statementDescriptor:
                    description: A string that displays on the recipient's bank or
                      card statement (up to 22 characters). A `statement_descriptor`
                      that's longer than 22 characters return an error. Most banks
                      truncate this information and display it inconsistently. Some
                      banks might not display it at all. For US ACH payouts, this
                      maps to the ACH Company Entry Description field, which the NACHA
                      standard limits to 10 characters. Stripe truncates descriptors
                      longer than 10 characters for US ACH payouts.
                    type: string
                    x-kubernetes-validations:
                    - message: statementDescriptor is immutable
                      rule: self == oldSelf
                required:
                - amount
                - currency
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  amount:
                    description: The amount (in cents (or local equivalent)) that
                      transfers to your bank account or debit card.
                    format: int64
                    type: integer
                  applicationFee:
                    description: The application fee (if any) for the payout. [See
                      the Connect documentation](https://docs.stripe.com/connect/instant-payouts#monetization-and-fees)
                      for details.
                    type: string
                  applicationFeeAmount:
                    description: The amount of the application fee (if any) requested
                      for the payout. [See the Connect documentation](https://docs.stripe.com/connect/instant-payouts#monetization-and-fees)
                      for details.
                    format: int64
                    type: integer
                  arrivalDate:
                    description: Date that you can expect the payout to arrive in
                      the bank. This factors in delays to account for weekends or
                      bank holidays.
                    format: int64
                    type: integer
                  automatic:
                    description: Returns `true` if the payout is created by an [automated
                      payout schedule](https://docs.stripe.com/payouts#payout-schedule)
                      and `false` if it's [requested manually](https://stripe.com/docs/payouts#manual-payouts).
                    type: boolean
                  balanceTransaction:
                    description: ID of the balance transaction that describes the
                      impact of this payout on your account balance.
                    type: string
                  created:
                    description: Time at which the object was created. Measured in
                      seconds since the Unix epoch.
                    format: int64
                    type: integer
                  currency:
                    description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
                      in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                    type: string
                  description:
                    description: An arbitrary string attached to the object. Often
                      useful for displaying to users.
                    type: string
                  destination:
                    description: ID of the bank account or card the payout is sent
                      to.
                    type: string
                  failureBalanceTransaction:
                    description: If the payout fails or cancels, this is the ID of
                      the balance transaction that reverses the initial balance transaction
                      and returns the funds from the failed payout back in your balance.
                    type: string
                  failureCode:
                    description: Error code that provides a reason for a payout failure,
                      if available. View our [list of failure codes](https://docs.stripe.com/api#payout_failures).
                    type: string
                  failureMessage:
                    description: Message that provides the reason for a payout failure,
                      if available.
                    type: string
                  id:
                    description: Unique identifier for the object.
                    type: string
                  livemode:
                    description: If the object exists in live mode, the value is `true`.
                      If the object exists in test mode, the value is `false`.
                    type: boolean
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                    type: object
                  method:
                    description: The method used to send this payout, which can be
                      `standard` or `instant`. `instant` is supported for payouts
                      to debit cards and bank accounts in certain countries. Learn
                      more about [bank support for Instant Payouts](https://stripe.com/docs/payouts/instant-payouts-banks).
                    type: string
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  originalPayout:
                    description: If the payout reverses another, this is the ID of
                      the original payout.
                    type: string
                  payoutMethod:
                    description: ID of the v2 FinancialAccount the funds are sent
                      to.
                    type: string
                  reconciliationStatus:
                    description: If `completed`, you can use the [Balance Transactions
                      API](https://docs.stripe.com/api/balance_transactions/list#balance_transaction_list-payout)
                      to list all balance transactions that are paid out in this payout.
                    type: string
                  reversedBy:
                    description: If the payout reverses, this is the ID of the payout
                      that reverses this payout.
                    type: string
                  sourceType:
                    description: 'The source balance this payout came from, which
                      can be one of the following: `card`, `fpx`, or `bank_account`.'
                    type: string
                  statementDescriptor:
                    description: Extra information about a payout that displays on
                      the user's bank statement.
                    type: string
                  status:
                    description: 'Current status of the payout: `paid`, `pending`,
                      `in_transit`, `canceled` or `failed`. A payout is `pending`
                      until it''s submitted to the bank, when it becomes `in_transit`.
                      The status changes to `paid` if the transaction succeeds, or
                      to `failed` or `canceled` (within 5 business days). Some payouts
                      that fail might initially show as `paid`, then change to `failed`.'
                    type: string
                  traceId:
                    description: A value that generates from the beneficiary's bank
                      that allows users to track payouts with their bank. Banks might
                      call this a "reference number" or something similar.
                    x-kubernetes-preserve-unknown-fields: true
                  type:
                    description: Can be `bank_account` or `card`.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
