                  status:
                    description: 'Current status of the OutboundPayment: `processing`,
                      `failed`, `posted`, `returned`, `canceled`. An OutboundPayment
                      is `processing` if it has been created and is pending. The status
                      changes to `posted` once the OutboundPayment has been "confirmed"
