        description: 'A portal configuration describes the functionality and behavior
          you embed in a portal session. Related guide: [Configure the customer portal](/customer-management/configure-portal).'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
