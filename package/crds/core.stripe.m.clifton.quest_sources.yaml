    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          `Source` objects allow you to accept a variety of payment methods. They
          represent a customer's payment instrument, and can be used with the Stripe API
          just like a `Card` object: once chargeable, they can be charged, or can be
          attached to customers.

          Stripe doesn't recommend using the deprecated [Sources API](https://docs.stripe.com/api/sources).
          We recommend that you adopt the [PaymentMethods API](https://docs.stripe.com/api/payment_methods).
          This newer API provides access to our latest features and payment method types.

          Related guides: [Sources API](https://docs.stripe.com/sources) and [Sources & Customers](https://docs.stripe.com/sources/customers).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                properties:
                  amount:
                    description: Amount associated with the source. This is the amount
                      for which the source will be chargeable once ready. Required
                      for `single_use` sources. Not supported for `receiver` type
                      sources, where charge amount may not be specified until funds
                      land.
                    format: int64
                    type: integer
                  currency:
                    description: Three-letter [ISO code for the currency](https://stripe.com/docs/currencies)
                      associated with the source. This is the currency for which the
                      source will be chargeable once ready.
                    type: string
                    x-kubernetes-validations:
                    - message: currency is immutable
                      rule: self == oldSelf
                  customer:
                    description: The `Customer` to whom the original source is attached
                      to. Must be set when the original source is not a `Source` (e.g.,
                      `Card`).
                    type: string
                    x-kubernetes-validations:
                    - message: customer is immutable
                      rule: self == oldSelf
                  customerRef:
                    description: A NamespacedReference to a named object.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  customerSelector:
                    description: NamespacedSelector selects a namespaced object.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  flow:
                    description: The authentication `flow` of the source to create.
                      `flow` is one of `redirect`, `receiver`, `code_verification`,
                      `none`. It is generally inferred unless a type supports multiple
                      flows.
                    enum:
                    - code_verification
                    - none
                    - receiver
                    - redirect
                    type: string
                    x-kubernetes-validations:
