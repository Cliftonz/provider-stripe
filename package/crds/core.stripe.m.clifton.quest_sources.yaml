                    type: boolean
                  metadata:
                    additionalProperties:
                      type: string
                    description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                      that you can attach to an object. This can be useful for storing
                      additional information about the object in a structured format.
                    type: object
                  multibanco:
                    x-kubernetes-preserve-unknown-fields: true
                  object:
                    description: String representing the object's type. Objects of
                      the same type share the same value.
                    type: string
                  owner:
                    description: Information about the owner of the payment instrument
                      that may be used or required by particular source types.
                    x-kubernetes-preserve-unknown-fields: true
                  p24:
                    x-kubernetes-preserve-unknown-fields: true
                  receiver:
                    x-kubernetes-preserve-unknown-fields: true
                  redirect:
                    x-kubernetes-preserve-unknown-fields: true
                  sepaDebit:
                    x-kubernetes-preserve-unknown-fields: true
                  sofort:
                    x-kubernetes-preserve-unknown-fields: true
                  sourceOrder:
                    x-kubernetes-preserve-unknown-fields: true
                  statementDescriptor:
                    description: Extra information about a source. This will appear
                      on your customer's statement every time you charge the source.
                    type: string
                  status:
                    description: The status of the source, one of `canceled`, `chargeable`,
                      `consumed`, `failed`, or `pending`. Only `chargeable` sources
                      can be used to create a charge.
                    type: string
                  threeDSecure:
                    x-kubernetes-preserve-unknown-fields: true
                  type:
                    description: The `type` of the source. The `type` is a payment
                      method, one of `ach_credit_transfer`, `ach_debit`, `alipay`,
                      `bancontact`, `card`, `card_present`, `eps`, `giropay`, `ideal`,
                      `multibanco`, `klarna`, `p24`, `sepa_debit`, `sofort`, `three_d_secure`,
