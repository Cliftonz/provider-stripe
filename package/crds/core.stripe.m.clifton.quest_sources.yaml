                          line2:
                            type: string
                          postalCode:
                            type: string
                          state:
                            type: string
                        type: object
                      email:
                        type: string
                      name:
                        type: string
                      phone:
                        type: string
                    type: object
                  receiver:
                    description: Optional parameters for the receiver flow. Can be
                      set only if the source is a receiver (`flow` is `receiver`).
                    properties:
                      refundAttributesMethod:
                        enum:
                        - email
                        - manual
                        - none
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: receiver is immutable
                      rule: self == oldSelf
                  redirect:
                    description: Parameters required for the redirect flow. Required
                      if the source is authenticated by a redirect (`flow` is `redirect`).
                    properties:
                      returnUrl:
                        type: string
                    required:
                    - returnUrl
                    type: object
                    x-kubernetes-validations:
