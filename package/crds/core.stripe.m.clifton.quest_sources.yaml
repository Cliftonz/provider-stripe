                      a name matching this value. It contains additional information
                      specific to the [payment method](https://docs.stripe.com/sources)
                      used.
                    type: string
                  usage:
                    description: Either `reusable` or `single_use`. Whether this source
                      should be reusable or not. Some source types may or may not
                      be reusable by construction, while others may leave the option
                      at creation. If an incompatible value is passed, an error will
                      be returned.
                    type: string
                  wechat:
                    x-kubernetes-preserve-unknown-fields: true
