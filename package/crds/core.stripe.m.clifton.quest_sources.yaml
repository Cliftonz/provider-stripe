                      in a checkout flow. The field defaults to “unspecified”.
                    type: string
                  amount:
                    description: A positive integer in the smallest currency unit
                      (that is, 100 cents for $1.00, or 1 for ¥1, Japanese Yen being
                      a zero-decimal currency) representing the total amount associated
                      with the source. This is the amount for which the source will
                      be chargeable once ready. Required for `single_use` sources.
                    format: int64
                    type: integer
                  auBecsDebit:
