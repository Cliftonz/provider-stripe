                      rule: self == oldSelf
                  sourceOrder:
                    description: Information about the items and shipping associated
                      with the source. Required for transactional credit (for example
                      Klarna) sources before you can charge it.
                    properties:
                      items:
                        items:
                          properties:
                            amount:
                              format: int64
                              type: integer
                            currency:
                              type: string
                            description:
                              type: string
                            parent:
                              type: string
                            quantity:
                              format: int64
                              type: integer
                            type:
                              enum:
                              - discount
                              - shipping
                              - sku
                              - tax
                              type: string
                          type: object
                        type: array
                      shipping:
                        properties:
                          address:
                            properties:
                              city:
                                type: string
                              country:
                                type: string
                              line1:
                                type: string
                              line2:
                                type: string
                              postalCode:
                                type: string
                              state:
                                type: string
                            required:
                            - line1
                            type: object
                          carrier:
                            type: string
                          name:
                            type: string
                          phone:
                            type: string
                          trackingNumber:
                            type: string
                        required:
                        - address
                        type: object
                    type: object
                  statementDescriptor:
                    description: An arbitrary string to be displayed on your customer's
                      statement. As an example, if your website is `RunClub` and the
                      item you're charging for is a race ticket, you may want to specify
                      a `statement_descriptor` of `RunClub 5K race ticket.` While
                      many payment types will display this information, some may not
                      display it at all.
                    type: string
                    x-kubernetes-validations:
                    - message: statementDescriptor is immutable
                      rule: self == oldSelf
                  token:
                    description: An optional token used to create the source. When
                      passed, token properties will override source parameters.
                    type: string
                    x-kubernetes-validations:
                    - message: token is immutable
                      rule: self == oldSelf
                  type:
                    description: The `type` of the source to create. Required unless
                      `customer` and `original_source` are specified (see the [Cloning
                      card Sources](https://docs.stripe.com/sources/connect#cloning-card-sources)
                      guide)
                    type: string
                    x-kubernetes-validations:
                    - message: type is immutable
                      rule: self == oldSelf
                  usage:
                    enum:
                    - reusable
                    - single_use
                    type: string
                    x-kubernetes-validations:
                    - message: usage is immutable
                      rule: self == oldSelf
                type: object
              managementPolicies:
                default:
