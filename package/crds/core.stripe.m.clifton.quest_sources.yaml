                                type: integer
                              ip:
                                type: string
                              userAgent:
                                type: string
                            type: object
                          status:
                            enum:
                            - accepted
                            - pending
                            - refused
                            - revoked
                            type: string
                          type:
                            enum:
                            - offline
                            - online
                            type: string
                          userAgent:
                            type: string
                        required:
                        - status
                        type: object
                      amount:
                        format: int64
                        type: integer
                      currency:
                        type: string
                      interval:
                        enum:
                        - one_time
                        - scheduled
                        - variable
                        type: string
                      notificationMethod:
                        enum:
                        - deprecated_none
                        - email
                        - manual
                        - none
                        - stripe_email
                        type: string
                    type: object
                  metadata:
                    additionalProperties:
                      type: string
                    type: object
                  originalSource:
                    description: The source to share.
                    type: string
                    x-kubernetes-validations:
