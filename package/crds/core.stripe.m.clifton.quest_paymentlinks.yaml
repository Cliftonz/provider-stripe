                        - hosted_confirmation
                        - redirect
                        type: string
                    required:
                    - type
                    type: object
                  allowPromotionCodes:
                    description: Enables user redeemable promotion codes.
                    type: boolean
                  applicationFeeAmount:
                    description: The amount of the application fee (if any) that will
                      be requested to be applied to the payment and transferred to
                      the application owner's Stripe account. Can only be applied
                      when there are no line items with recurring prices.
                    format: int64
                    type: integer
                  applicationFeePercent:
                    description: A non-negative decimal between 0 and 100, with at
                      most two decimal places. This represents the percentage of the
                      subscription invoice total that will be transferred to the application
                      owner's Stripe account. There must be at least 1 line item with
                      a recurring price to use this field.
                    type: number
                  automaticTax:
                    description: Configuration for automatic tax collection.
                    properties:
                      enabled:
                        type: boolean
                      liability:
                        properties:
                          account:
                            type: string
                          type:
                            enum:
                            - account
                            - self
                            type: string
                        required:
                        - type
                        type: object
                    required:
                    - enabled
                    type: object
                  billingAddressCollection:
                    description: Configuration for collecting the customer's billing
                      address. Defaults to `auto`.
                    enum:
                    - auto
                    - required
                    type: string
                  consentCollection:
                    description: Configure fields to gather active consent from customers.
