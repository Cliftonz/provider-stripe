                      cannot be after the coupon's `redeems_by`.
                    format: int64
                    type: integer
                    x-kubernetes-validations:
                    - message: expiresAt is immutable
                      rule: self == oldSelf
                  maxRedemptions:
                    description: A positive integer specifying the number of times
                      the promotion code can be redeemed. If the coupon has specified
