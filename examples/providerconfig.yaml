apiVersion: v1
kind: Secret
metadata:
  name: stripe-credentials
  namespace: default
type: Opaque
stringData:
  credentials: |
    {"apiKey": "sk_test_<secret>"}
---
apiVersion: stripe.m.clifton.quest/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  credentials:
    source: Secret
    secretRef:
      name: stripe-credentials
      namespace: default
      key: credentials
