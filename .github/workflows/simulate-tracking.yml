name: Simulate Spec Tracking

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Resolve latest spec release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo stripe/openapi --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Fetch spec
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: hack/spec-fetch.sh "$TAG" "$RUNNER_TEMP/spec3.json"
      - name: Detect change
        id: spec
        run: hack/spec-changed.sh openapi/spec3.json "$RUNNER_TEMP/spec3.json" | tee -a "$GITHUB_OUTPUT"
      - name: Resolve stripe-go
        id: stripe_go
        env:
          API_VERSION: ${{ steps.spec.outputs.new_version }}
        run: |
          version=$(hack/stripe-go-for-api.sh "$API_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Regenerate
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          STRIPE_GO: ${{ steps.stripe_go.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/spec3.json" openapi/spec3.json
          echo "$TAG" > openapi/VERSION
          go get "github.com/stripe/stripe-go/${STRIPE_GO%%.*}@${STRIPE_GO}"
          go mod tidy
          make generate
      - name: Breaking-change gate
        id: breaking
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: make crd-breaking-changes
      - name: Report breaking-change gate
        env:
          OUTCOME: ${{ steps.breaking.outcome }}
        run: |
          echo "CRD breaking-change gate: ${OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
      - name: Check changed paths
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
          hack/patch-paths.sh "$RUNNER_TEMP/changes.patch"
